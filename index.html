<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sihirli Oyun Dünyası ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Genel Sayfa Tasarımı */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #ffd1dc 0%, #fbe4ff 50%, #e2f0ff 100%);
            min-height: 100vh;
            padding: 20px;
            color: #5a3d5c;
        }

        /* Başlık / Banner Alanı */
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(235, 120, 180, 0.2);
            border: 2px solid #fff;
        }

        header h1 {
            font-size: 2.2rem;
            color: #ff4081;
            text-shadow: 2px 2px 0px #fff;
        }

        /* Oyunların Dizileceği Izgara (Grid) */
        .game-grid {
            display: grid;
            /* Sol üstten başlar, ekrana göre 180px genişlikte kartlar dizilir */
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            justify-content: start; /* Sol köşeden başlama garantisi */
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Oyun Kartı Stili */
        .game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            background: #ffffff;
            border-radius: 20px;
            padding: 12px;
            border: 3px solid #ffb6c1;
            box-shadow: 0 6px 15px rgba(255, 105, 180, 0.15);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        /* Fare Üzerine Gelince (Hover Efekti) */
        .game-card:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: #ff4081;
            box-shadow: 0 12px 25px rgba(255, 64, 129, 0.3);
        }

        /* Kapak Fotoğrafı (PNG) */
        .game-card img {
            width: 100%;
            height: 160px;
            object-fit: cover; /* Fotoğrafın oranını bozmadan sığdırır */
            border-radius: 12px;
            background-color: #fff0f5; /* PNG saydam ise arkasında duracak renk */
        }

        /* Oyun Adı */
        .game-title {
            margin-top: 10px;
            font-size: 1rem;
            font-weight: 600;
            color: #d81b60;
            text-align: center;
        }

        /* Kart Üzerindeki Işıltı Efekti */
        .game-card::after {
            content: '✨';
            position: absolute;
            top: 5px;
            right: 8px;
            font-size: 1.2rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .game-card:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body>

    <header>
        <h1>💖 Oyun Dünyası 👑</h1>
    </header>

    <main class="game-grid">
        
        <!-- ==================== 1. OYUN (BAŞLANGIÇ) ==================== -->
        <a href="https://mathiunoyunu.github.io" target="_blank" class="game-card">
            <!-- Oyun kapak fotoğrafınız index.html ile aynı klasörde olsun -->
            <img src="kapak.jpg" alt="Oyun 1">
            <span class="game-title">MATHİNİN ONU OYUNU</span>
        </a>
        <!-- ============================================================ -->

        <!-- Yeni oyunlar eklemek istediğinizde yukarıdaki bloğu kopyalayıp buraya yapıştırabilirsiniz. -->

    </main>

</body>
</html>
